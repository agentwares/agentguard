name: "Publish agentguard to the MCP Registry"

on:
  push:
    tags: ["agentguard-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      SERVER_JSON: "apps/agentguard-cli/server.json"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: |
          dir="$(dirname "$SERVER_JSON")"
          if [ "$(basename "$SERVER_JSON")" != "server.json" ]; then cp "$SERVER_JSON" "$dir/server.json"; fi
          cd "$dir" && "$GITHUB_WORKSPACE/mcp-publisher" publish
